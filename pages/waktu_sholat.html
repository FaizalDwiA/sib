	<script>
		/* ── Clock ── */
		setInterval(() => {
			const now = new Date();
			const h = String(now.getHours()).padStart(2, '0');
			const m = String(now.getMinutes()).padStart(2, '0');
			const s = String(now.getSeconds()).padStart(2, '0');
			document.getElementById('waktu').innerText = `${h} : ${m} : ${s}`;
		}, 1000);

		/* ── City search ── */
		let currentCity = 'Surakarta';

		function searchCity() {
			const val = document.getElementById('searchInput').value.trim();
			if (val) {
				currentCity = val;
				document.getElementById('city-name').innerText = val;
				getPrayerTimes(val);
			}
		}
		document.getElementById('searchInput').addEventListener('keydown', function (e) {
			if (e.key === 'Enter') searchCity();
		});

		/* ── Adjust times ── */
		function adjustTime(data, type) {
			let [jam, menit] = data.split(':').map(Number);
			if (type === 'subuh') menit -= 21;
			if (type === 'asar') menit += 1;
			if (type === 'isya') menit += 12;
			if (menit < 0) {
				jam -= 1;
				menit += 60;
			}
			if (menit >= 60) {
				jam += 1;
				menit -= 60;
			}
			return `${String(jam).padStart(2,'0')}:${String(menit).padStart(2,'0')}`;
		}

		function convertToDate(timeStr) {
			const now = new Date();
			const [h, m] = timeStr.split(':');
			return new Date(now.getFullYear(), now.getMonth(), now.getDate(), +h, +m);
		}

		/* ── LocalStorage helpers ── */
		const LS_KEY = 'waktu_sholat_cache';

		function getTodayDateStr() {
			const now = new Date();
			return `${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()}`;
		}

		function saveToCache(city, data) {
			try {
				const cache = {
					city: city.toLowerCase(),
					date: getTodayDateStr(),
					data: data
				};
				localStorage.setItem(LS_KEY, JSON.stringify(cache));
			} catch (e) {
				console.warn('Gagal menyimpan ke localStorage:', e);
			}
		}

		function loadFromCache(city) {
			try {
				const raw = localStorage.getItem(LS_KEY);
				if (!raw) return null;
				const cache = JSON.parse(raw);
				// Cache valid jika kota sama dan tanggal hari ini
				if (
					cache.city === city.toLowerCase() &&
					cache.date === getTodayDateStr()
				) {
					return cache.data;
				}
			} catch (e) {
				console.warn('Gagal membaca localStorage:', e);
			}
			return null;
		}

		/* ── Render prayer data ke DOM ── */
		function renderPrayerData(data) {
			const t = data.timings;
			document.getElementById('subuh').innerText = t.Fajr;
			document.getElementById('terbit').innerText = t.Sunrise;
			document.getElementById('dhuhur').innerText = t.Dhuhr;
			document.getElementById('asar').innerText = t.Asr;
			document.getElementById('tenggelam').innerText = t.Sunset;
			document.getElementById('magrib').innerText = t.Maghrib;
			document.getElementById('isya').innerText = t.Isha;
			document.getElementById('tengahMalam').innerText = t.Midnight;

			const g = data.date.gregorian;
			const h = data.date.hijri;
			document.getElementById('masehi').innerText =
				`${g.weekday.en}, ${g.day} ${g.month.en} ${g.year}`;
			document.getElementById('hijriah').innerText =
				`${h.weekday.en}, ${h.day} ${h.month.en} ${h.year}`;

			startCountdown(t);
		}

		/* ── Fetch prayer times (dengan cache localStorage) ── */
		function getPrayerTimes(city = 'Surakarta') {
			// Cek cache dulu
			const cached = loadFromCache(city);
			if (cached) {
				console.log(`[Cache] Memuat waktu sholat "${city}" dari localStorage.`);
				renderPrayerData(cached);
				return;
			}

			// Jika tidak ada cache / kadaluarsa → fetch API
			console.log(`[API] Mengambil waktu sholat "${city}" dari server...`);
			fetch(`https://api.aladhan.com/v1/timingsByCity?city=${encodeURIComponent(city)}&country=Indonesia&method=2`)
				.then(r => r.json())
				.then(apiData => {
					const t = apiData.data.timings;
					t.Fajr = adjustTime(t.Fajr, 'subuh');
					t.Asr = adjustTime(t.Asr, 'asar');
					t.Isha = adjustTime(t.Isha, 'isya');

					// Simpan ke localStorage sebelum render
					saveToCache(city, apiData.data);

					renderPrayerData(apiData.data);
				})
				.catch(() => {
					// Fallback: coba tampilkan cache lama (beda hari) jika ada
					try {
						const raw = localStorage.getItem(LS_KEY);
						if (raw) {
							const oldCache = JSON.parse(raw);
							if (oldCache.city === city.toLowerCase()) {
								console.warn('[Fallback] Menampilkan cache lama karena gagal fetch.');
								renderPrayerData(oldCache.data);
								document.getElementById('waktu-selanjutnya').innerHTML =
									'<span class="next-label">CACHE</span>Data offline (kemarin). Cek koneksi.';
								return;
							}
						}
					} catch (e) {}
					document.getElementById('waktu-selanjutnya').innerHTML =
						'<span class="next-label">ERROR</span>Gagal memuat data. Cek koneksi.';
				});
		}

		/* ── Countdown ── */
		function startCountdown(t) {
			const prayers = [{
					name: 'Subuh',
					id: 'row-subuh',
					time: convertToDate(t.Fajr)
				},
				{
					name: 'Matahari Terbit',
					id: 'row-terbit',
					time: convertToDate(t.Sunrise)
				},
				{
					name: 'Dhuhur',
					id: 'row-dhuhur',
					time: convertToDate(t.Dhuhr)
				},
				{
					name: 'Asar',
					id: 'row-asar',
					time: convertToDate(t.Asr)
				},
				{
					name: 'Matahari Tenggelam',
					id: 'row-tenggelam',
					time: convertToDate(t.Sunset)
				},
				{
					name: 'Magrib',
					id: 'row-magrib',
					time: convertToDate(t.Maghrib)
				},
				{
					name: 'Isya',
					id: 'row-isya',
					time: convertToDate(t.Isha)
				},
				{
					name: 'Tengah Malam',
					id: 'row-tengahMalam',
					time: convertToDate(t.Midnight)
				},
			];

			// Clear old badges
			document.querySelectorAll('.next-badge').forEach(el => el.remove());
			document.querySelectorAll('.prayer-table tr').forEach(r => r.classList.remove('active-prayer'));

			setInterval(() => {
				const now = new Date();
				let next = null;
				for (const p of prayers) {
					if (now < p.time) {
						next = p;
						break;
					}
				}

				// Reset highlights
				document.querySelectorAll('.prayer-table tr').forEach(r => r.classList.remove('active-prayer'));
				document.querySelectorAll('.next-badge').forEach(el => el.remove());

				if (next) {
					const diff = Math.floor((next.time - now) / 60000);
					const jam = Math.floor(diff / 60);
					const menit = diff % 60;
					const label = jam > 0 ? `${jam} jam ${menit} menit` : `${menit} menit`;

					document.getElementById('waktu-selanjutnya').innerHTML =
						`<span class="next-label">BERIKUTNYA</span>${next.name} dalam ${label}`;

					const row = document.getElementById(next.id);
					if (row) {
						row.classList.add('active-prayer');
						const firstTd = row.querySelector('td');
						if (firstTd) {
							const badge = document.createElement('span');
							badge.className = 'next-badge';
							badge.textContent = 'SELANJUTNYA';
							firstTd.appendChild(badge);
						}
					}
				} else {
					document.getElementById('waktu-selanjutnya').innerHTML =
						'<span class="next-label">INFO</span>Tidak ada waktu sholat berikutnya hari ini';
				}
			}, 1000);
		}

		/* ── Back to Top ── */
		(function () {
			const btn = document.querySelector('.back-to-top');
			window.addEventListener('scroll', () => btn.classList.toggle('show', window.scrollY > 200), {
				passive: true
			});
			btn.addEventListener('click', e => {
				e.preventDefault();
				window.scrollTo({
					top: 0,
					behavior: 'smooth'
				});
			});
		})();

		/* ── Init ── */
		getPrayerTimes('Surakarta');
	</script>
</body>

</html>
